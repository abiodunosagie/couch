<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Remote</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="room">
    <section class="remote" aria-label="Remote">
      <div class="remote-top">
        <span class="led" id="led" aria-hidden="true"></span>
        <button class="key key-power" data-key="POWER" aria-label="Power">
          <svg viewBox="0 0 24 24"><path d="M12 3v8M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>
        </button>
      </div>

      <div class="pad" role="group" aria-label="Direction pad">
        <button class="pad-dir pad-up" data-key="DPAD_UP" data-repeat aria-label="Up"><svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg></button>
        <button class="pad-dir pad-right" data-key="DPAD_RIGHT" data-repeat aria-label="Right"><svg viewBox="0 0 24 24"><path d="M10 7l5 5-5 5"/></svg></button>
        <button class="pad-dir pad-down" data-key="DPAD_DOWN" data-repeat aria-label="Down"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
        <button class="pad-dir pad-left" data-key="DPAD_LEFT" data-repeat aria-label="Left"><svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5"/></svg></button>
        <button class="pad-ok" data-key="DPAD_CENTER" aria-label="Select">OK</button>
      </div>

      <div class="row-nav">
        <button class="key" data-key="BACK" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
        <button class="key" data-key="HOME" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
        <button class="key" data-key="SETTINGS" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
      </div>

      <div class="row-body">
        <div class="rocker" role="group" aria-label="Volume">
          <button data-key="VOLUME_UP" data-repeat aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
          <span class="rocker-label">vol</span>
          <button data-key="VOLUME_DOWN" data-repeat aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        </div>

        <div class="media">
          <button class="key" data-key="MEDIA_REWIND" aria-label="Rewind"><svg viewBox="0 0 24 24"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/></svg></button>
          <button class="key key-wide" data-key="MEDIA_PLAY_PAUSE" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM16 5v14M20 5v14"/></svg></button>
          <button class="key" data-key="MEDIA_FAST_FORWARD" aria-label="Fast forward"><svg viewBox="0 0 24 24"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg></button>
          <button class="key" data-key="VOLUME_MUTE" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/></svg></button>
          <button class="key" data-key="TV_INPUT" aria-label="TV input"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 20v-6M9 17l3 3 3-3"/></svg></button>
          <button class="key" data-key="GUIDE" aria-label="Guide"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
        </div>
      </div>

      <div class="row-apps">
        <button class="app-key app-youtube" data-app="youtube">YouTube</button>
        <button class="app-key app-netflix" data-app="netflix">NETFLIX</button>
      </div>
    </section>

    <aside class="panel">
      <header class="readout">
        <p class="readout-status" id="status">Starting</p>
        <h1 class="readout-tv" id="tv-name">TV Remote</h1>
        <p class="readout-app">Now on <strong id="app-name">nothing yet</strong></p>
      </header>

      <form class="pair" id="pair-form" hidden>
        <label for="pair-code">Code on your TV</label>
        <div class="field-row">
          <input id="pair-code" name="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A1B2C3">
          <button type="submit" class="action">Pair</button>
        </div>
        <button type="button" class="link" id="pair-start">Show a code on the TV</button>
      </form>

      <form class="type" id="text-form">
        <label for="text-input">Type on the TV</label>
        <div class="field-row">
          <input id="text-input" maxlength="200" autocomplete="off" placeholder="Search for a show, a password, anything">
          <button type="submit" class="action">Send</button>
        </div>
      </form>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>

      <dl class="shortcuts">
        <div><dt>arrows</dt><dd>move</dd></div>
        <div><dt>enter</dt><dd>select</dd></div>
        <div><dt>esc</dt><dd>back</dd></div>
        <div><dt>h</dt><dd>home</dd></div>
        <div><dt>space</dt><dd>play / pause</dd></div>
        <div><dt>+ -</dt><dd>volume</dd></div>
        <div><dt>m</dt><dd>mute</dd></div>
        <div><dt>p</dt><dd>power</dd></div>
        <div><dt>/</dt><dd>type text</dd></div>
      </dl>

      <button class="link quit" id="quit">Quit TV Remote</button>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
