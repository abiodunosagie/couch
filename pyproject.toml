[project]
name = "tvremote"
version = "0.1.0"
description = "Helper for Couch, a native Mac remote for Google TV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "androidtvremote2>=0.3.2",
    "zeroconf>=0.151.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
