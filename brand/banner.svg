<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><title>Couch</title><rect width="1280" height="640" fill="#1C1A18"/><style>
.wipe{transform-box:fill-box;transform-origin:left center;animation:wipe 1.4s cubic-bezier(.65,0,.35,1) .2s both}
.dot{transform-box:fill-box;transform-origin:center;animation:press .7s cubic-bezier(.34,1.56,.64,1) 1.5s both}
.line{animation:fade .8s ease-out 2s both}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes press{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wipe,.dot,.line{animation:none}}
</style><defs><clipPath id="reveal"><rect class="wipe" x="100" y="0" width="1100" height="640"/></clipPath></defs><g clip-path="url(#reveal)"><g transform="translate(140,67.0) scale(1.5)"><path d="M99.30,185.14 A50,50 0 1 1 99.30,120.86 M261,103 V163 A40,40 0 0 0 341,163 V103 M341,103 V203 M459.30,185.14 A50,50 0 1 1 459.30,120.86 M491,53 V203 M491,143 A40,40 0 0 1 571,143 V203" fill="none" stroke="#F6F1E9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="179" cy="153" r="50" fill="none" stroke="#F6F1E9" stroke-width="22"/></g></g><g transform="translate(140,67.0) scale(1.5)"><circle class="dot" cx="179" cy="153" r="13" fill="#EE8E73"/></g><g class="line"><text x="140" y="458.0" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="40" fill="#F6F1E9">A native Mac remote for Google TV.</text><text x="140" y="510.0" font-family="Menlo,monospace" font-size="24" fill="#A39B91">menu bar · keyboard · trackpad · voice · phone</text></g></svg>
